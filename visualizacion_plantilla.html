<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruta viva — Casos de prueba</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #142a4f;
    --muted: #5b6b82;
    --label: #5b7a9d;
    --surface: #f3f6fa;
    --border: #e1e7ef;
    --accent: #b3452f;
    --ok: #2f7d5e;
    --gris: #a9b4c4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--fg);
    padding: 32px 24px 60px;
  }
  .wrap { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

  .label { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: var(--label); text-transform: uppercase; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.01em; }

  .escenarios { display: flex; flex-wrap: wrap; gap: 8px; }
  .escenarios button {
    font: inherit;
    font-size: 13.5px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--fg);
    cursor: pointer;
  }
  .escenarios button.activo { background: var(--fg); color: #fff; border-color: var(--fg); }

  .panel { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
  @media (max-width: 720px) { .panel { grid-template-columns: 1fr; } }

  .mapa-wrap { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); padding: 12px; overflow: hidden; }
  svg { width: 100%; height: auto; display: block; }

  .lateral { display: flex; flex-direction: column; gap: 14px; }
  .ficha { border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
  .ficha .t { font-size: 12px; font-weight: 700; color: var(--label); text-transform: uppercase; letter-spacing: 0.06em; }
  .ficha .v { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }

  .lista { border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; display: flex; flex-direction: column; gap: 8px; font-size: 13.5px; }
  .lista-item { display: flex; justify-content: space-between; gap: 10px; }
  .lista-item.excluido { color: var(--muted); }
  .lista-item .motivo { font-size: 11.5px; color: var(--muted); }

  .leyenda { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--muted); }
  .leyenda span { display: inline-flex; align-items: center; gap: 6px; }
  .leyenda i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>
<div class="wrap">

  <div>
    <div class="label">Ruta viva</div>
    <h1>Casos de prueba — mapa del recorrido</h1>
  </div>

  <div class="escenarios" id="escenarios"></div>

  <div class="leyenda">
    <span><i style="background:var(--ok);"></i>Visitado</span>
    <span><i style="background:var(--gris);"></i>Descartado</span>
    <span><i style="background:var(--accent);"></i>Partida</span>
    <span>— línea sólida: a pie &nbsp; · &nbsp; línea punteada: transporte</span>
  </div>

  <div class="panel">
    <div class="mapa-wrap">
      <svg id="svg" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div class="lateral">
      <div class="ficha"><div class="t">Metros caminados</div><div class="v" id="statMetros">—</div></div>
      <div class="ficha"><div class="t">Duración total</div><div class="v" id="statDuracion">—</div></div>
      <div class="ficha"><div class="t">Costo total</div><div class="v" id="statCosto">—</div></div>
      <div class="lista" id="listaLugares"></div>
    </div>
  </div>

</div>

<script>
const DATOS = /*__DATOS__*/;

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("svg");
const escenariosEl = document.getElementById("escenarios");
const listaEl = document.getElementById("listaLugares");

let actual = 0;

function el(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function render() {
  const d = DATOS[actual];

  // botones de escenario
  escenariosEl.innerHTML = "";
  DATOS.forEach((esc, i) => {
    const b = document.createElement("button");
    b.textContent = esc.nombre;
    b.className = i === actual ? "activo" : "";
    b.addEventListener("click", () => { actual = i; render(); });
    escenariosEl.appendChild(b);
  });

  // bounds para el viewBox (lugares + partida, con margen)
  const puntos = [d.partida, ...d.lugares];
  const xs = puntos.map((p) => p.x);
  const ys = puntos.map((p) => p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const margen = Math.max(60, (maxX - minX) * 0.15, (maxY - minY) * 0.15);
  const vx = minX - margen, vy = minY - margen;
  const vw = (maxX - minX) + margen * 2 || 400;
  const vh = (maxY - minY) + margen * 2 || 400;
  svg.setAttribute("viewBox", `${vx} ${vy} ${vw} ${vh}`);

  svg.innerHTML = "";

  // líneas del recorrido, en orden: partida -> parada1 -> parada2 -> ...
  const puntosRecorrido = [d.partida, ...d.paradas];
  for (let i = 1; i < puntosRecorrido.length; i++) {
    const a = puntosRecorrido[i - 1];
    const b = puntosRecorrido[i];
    const esAPie = d.paradas[i - 1].tramo === "TramoAPie";
    const linea = el("line", {
      x1: a.x, y1: a.y, x2: b.x, y2: b.y,
      stroke: "#142a4f", "stroke-width": Math.max(1.5, vw * 0.004),
      "stroke-dasharray": esAPie ? "0" : `${vw * 0.012},${vw * 0.008}`,
      opacity: 0.6,
    });
    svg.appendChild(linea);
  }

  const radio = Math.max(6, vw * 0.018);

  // partida
  svg.appendChild(el("circle", { cx: d.partida.x, cy: d.partida.y, r: radio * 0.9, fill: "#b3452f" }));
  const labelPartida = el("text", { x: d.partida.x, y: d.partida.y - radio * 1.4, "font-size": vw * 0.028, "text-anchor": "middle", fill: "#142a4f", "font-weight": "700" });
  labelPartida.textContent = d.partida.nombre;
  svg.appendChild(labelPartida);

  // lugares
  d.lugares.forEach((lugar) => {
    const color = lugar.visitado ? "#2f7d5e" : "#a9b4c4";
    svg.appendChild(el("circle", { cx: lugar.x, cy: lugar.y, r: radio, fill: color, opacity: lugar.visitado ? 1 : 0.55 }));
    const t = el("text", { x: lugar.x, y: lugar.y - radio * 1.3, "font-size": vw * 0.026, "text-anchor": "middle", fill: lugar.visitado ? "#142a4f" : "#5b6b82" });
    t.textContent = lugar.nombre;
    svg.appendChild(t);
    const t2 = el("text", { x: lugar.x, y: lugar.y + radio * 2.1, "font-size": vw * 0.02, "text-anchor": "middle", fill: "#5b6b82" });
    t2.textContent = lugar.tipo;
    svg.appendChild(t2);
  });

  // stats
  document.getElementById("statMetros").textContent = d.metros_caminados_total + " m";
  document.getElementById("statDuracion").textContent = d.duracion_total_min + " min";
  document.getElementById("statCosto").textContent = "$" + Math.round(d.costo_total);

  // lista de lugares
  listaEl.innerHTML = `<div style="font-size:12px;font-weight:700;color:var(--label);text-transform:uppercase;margin-bottom:2px;">${d.nombre}</div>
    <div style="font-size:12.5px;color:var(--muted);">${d.momento} · ${d.tiempo_disponible_min} min disponibles</div>`;
  d.lugares.forEach((lugar) => {
    const row = document.createElement("div");
    row.className = "lista-item" + (lugar.visitado ? "" : " excluido");
    row.innerHTML = lugar.visitado
      ? `<span>${lugar.nombre}</span><span style="color:var(--ok);">visitado</span>`
      : `<span>${lugar.nombre}</span><span class="motivo">${lugar.motivo_exclusion}</span>`;
    listaEl.appendChild(row);
  });
}

render();
</script>
</body>
</html>
